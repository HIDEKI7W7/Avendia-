# ==============================================================================
# CONFIGURACIÓN NGINX REVERSE PROXY PARA AVENDIA 3.0 API (VPS)
# ==============================================================================
# Ubicación en VPS: /etc/nginx/sites-available/avendia-api
# Enlace simbólico: ln -s /etc/nginx/sites-available/avendia-api /etc/nginx/sites-enabled/
# ==============================================================================

upstream avendia_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirección de HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.tu-dominio.com; # Reemplazar con el dominio o IP de tu VPS

    # Permite verificación de Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS seguro
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tu-dominio.com; # Reemplazar con el dominio de tu VPS

    # Certificados SSL (gestionados automáticamente por Certbot Let's Encrypt)
    # certbot --nginx -d api.tu-dominio.com
    ssl_certificate /etc/letsencrypt/live/api.tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tu-dominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Tamaño máximo de subida (crucial para importar formatos MINEDU y documentos grandes)
    client_max_body_size 50M;

    # Compresión Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Endpoints de la API
    location / {
        proxy_pass http://avendia_backend;
        proxy_http_version 1.1;

        # Cabeceras estándar de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Soporte para WebSockets / streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts extendidos para generaciones con IA (Gemini) y conversiones de LibreOffice
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Bloque específico para la comprobación de salud directa
    location = /api/v1/health {
        proxy_pass http://avendia_backend/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
